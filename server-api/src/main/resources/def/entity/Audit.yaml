type: object
properties:
  id:
    type: integer
    format: int64
    required: true
    description: Unique audit identifier
  message:
    type: string
    description: Message
    example: Script "send enrolment" failed groovyx.net.http.HttpResponseException Bad Request
  action:
    type: string
    description: Action
    example: Script failed
  systemUser:
    type: string
    description: First name and Last name of system user
    example: John Smith
  entityId:
    type: string
  entityIdentifier:
    type: string
  created:
    type: string
    format: date-time
  source:
    type: string
    description: Where the change came from (USER, API_TOKEN, ASSISTANT, AUTOMATION); empty when unknown
    example: ASSISTANT
  requestText:
    type: string
    description: Text of the request that caused the change, e.g. the message sent to the assistant
    example: Move tomorrow's evening classes at Sydney to room 2
  changeSetRef:
    type: string
    description: Reference to the change set this entry belongs to
  fieldChanges:
    type: array
    description: Recorded before and after values, one item per field
    items:
      $ref: './AuditFieldChange.yaml'
