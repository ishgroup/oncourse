type: object
properties:
  type:
    $ref: './FieldType.yaml'
  label:
    type: string
  helpText:
    type: string
  mandatory:
    type: boolean
  relatedFieldKey:
    type: string
    description: key of related field, that affects this type display
  relatedFieldValue:
    type: string
    description: Related field value, that allows this type to be shown
  validationType:
    $ref: '../enum/FieldValidationType.yaml'
  isVisibleToTutor:
    type: boolean
    description: Survey forms only. Answers to this field are shown to tutors of the class in the portal
