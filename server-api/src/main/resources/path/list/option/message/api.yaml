post:
  operationId: sendMessage
  description: >
    Validates the message request for the selected entities and, if valid, starts sending it in the
    background. When x-validate-only is not set, the response is the id of a background process (not a
    confirmation that sending has finished) - poll GET /control/{processId} for its status and, once it
    is Finished or Failed, for the result message. When x-validate-only is set, the response is instead
    the rendered preview of the message, computed synchronously.
  tags:
    - Message
  parameters:
    - name: messageType
      in: query
      type: string
      require: true
    - name: recipientsCount
      in: query
      type: number
      required: true
    - name: request
      in: body
      schema:
        $ref: './def/entity/messaging/SendMessageRequest.yaml'
      required: true
  responses:
    '200':
      description: >
        Success response. Either the rendered message preview (x-validate-only mode), or the id of the
        background sending process to poll via GET /control/{processId}.
      schema:
        type: string
    '400':
      description: Bad request error.
    default:
      description: Unexpected error
  x-permission:
    mask: view
    keyCode: UNDEFINED
    errorMessage: Sorry, you have no permissions to send message. Please contact your administrator
    custom:
      - ish.oncourse.server.security.api.permission.custom.MessageMassCheckPermission